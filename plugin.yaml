name: physis
version: 1.6.0
description: >
  Evidence-backed execution memory: per-repo graph context, a deterministic
  verify hook, and verified tool recipes that replay with zero provider calls
  and refuse when their inputs changed. Sessions that pass their check become
  approvable workflow candidates. Two bundled offline engines, no API key, no
  network, no Python dependencies.
author: Giovanni Pezzulli
requires_hermes: ">=0.23.0"
provides_tools:
  - physis_engine_status
  - physis_observe
  - physis_snapshot
  - physis_context
  - physis_query
  - physis_why
  - physis_diff
  - physis_classify
  - physis_chain
  - physis_grid
  - physis_ingest
  - physis_observed
  - physis_command
  - replant_run
  - replant_record
  - replant_stats
  - replant_demo
  - replant_show
  - physis_candidates
provides_hooks:
  - post_tool_call
  - pre_verify
  - pre_llm_call
config_schema:
  engine_bin:
    type: str
    default: ""
    description: "Optional override: path to physis-core, replant or a compatible engine (comma-separated allowed)"
  model_dir:
    type: str
    default: ""
    description: "Optional ONNX embedding model directory; empty = bundled BGE-small"
  auto_expand:
    type: bool
    default: true
    description: "When a classification is uncertain, add a learned ontology entry"
  auto_observe:
    type: bool
    default: false
    description: "After file writes, incrementally re-index the edited folder (bounded, best-effort)"
  verify_cmd:
    type: str
    default: ""
    description: "Command run after code edits; a non-zero exit keeps the turn going with the real failure output"
  auto_learn:
    type: bool
    default: false
    description: "After verify_cmd passes, save the session's shell steps as a workflow candidate (never replayed until approved)"
  replant_tools:
    type: str
    default: ""
    description: "Tools registry used by /physis replay; empty = <path>/.replant/tools.json, or the learned registry when present"
  budget:
    type: int
    default: 800
    description: "Default token budget for physis_context packets (100-4000)"
  timeout:
    type: int
    default: 20
    description: "Per-engine subprocess timeout in seconds"
tags:
  - code
  - context
  - retrieval
  - verification
  - offline
license: MIT
homepage: https://github.com/ilPez00/hermes-physis
