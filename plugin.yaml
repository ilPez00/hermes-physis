name: physis
version: 1.1.0
description: >
  Evidence-backed code context with two bundled offline engines: physis-core
  (coherence index, structural search, fixed-token context packets, semiotic
  classification) and replant (verified tool-recipe replay with zero provider
  calls). No API key, no network, no Python dependencies.
author: Giovanni Pezzulli
requires_hermes: ">=0.23.0"
provides_tools:
  - physis_engine_status
  - physis_observe
  - physis_snapshot
  - physis_context
  - physis_query
  - physis_why
  - physis_diff
  - physis_classify
  - physis_command
  - replant_run
  - replant_record
  - replant_stats
  - replant_demo
  - replant_show
provides_hooks:
  - post_tool_call
config_schema:
  engine_bin:
    type: str
    default: ""
    description: "Optional override: path to physis-core, replant or a compatible engine (comma-separated allowed)"
  auto_observe:
    type: bool
    default: false
    description: "After file writes, incrementally re-index the edited folder (bounded, best-effort)"
  budget:
    type: int
    default: 800
    description: "Default token budget for physis_context packets (100-4000)"
  timeout:
    type: int
    default: 20
    description: "Per-engine subprocess timeout in seconds"
tags:
  - code
  - context
  - retrieval
  - verification
  - offline
license: MIT
homepage: https://github.com/ilPez00/physis-core
