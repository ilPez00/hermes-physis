name: physis
version: 1.4.0
description: >
  Evidence-backed code context with two bundled offline engines: physis-core
  (adaptive semiotic grid that grows when uncertain, semantic embeddings,
  coherence index, structural search, fixed-token context over any text file,
  observation ingestion) and replant (verified
  tool-recipe replay with zero provider calls). No API key, no network, no
  Python dependencies.
author: Giovanni Pezzulli
requires_hermes: ">=0.23.0"
provides_tools:
  - physis_engine_status
  - physis_observe
  - physis_snapshot
  - physis_context
  - physis_query
  - physis_why
  - physis_diff
  - physis_classify
  - physis_chain
  - physis_grid
  - physis_ingest
  - physis_observed
  - physis_command
  - replant_run
  - replant_record
  - replant_stats
  - replant_demo
  - replant_show
provides_hooks:
  - post_tool_call
config_schema:
  engine_bin:
    type: str
    default: ""
    description: "Optional override: path to physis-core, replant or a compatible engine (comma-separated allowed)"
  model_dir:
    type: str
    default: ""
    description: "Optional ONNX embedding model directory; empty = bundled BGE-small"
  auto_expand:
    type: bool
    default: true
    description: "When a classification is uncertain, add a learned ontology entry"
  auto_observe:
    type: bool
    default: false
    description: "After file writes, incrementally re-index the edited folder (bounded, best-effort)"
  budget:
    type: int
    default: 800
    description: "Default token budget for physis_context packets (100-4000)"
  timeout:
    type: int
    default: 20
    description: "Per-engine subprocess timeout in seconds"
tags:
  - code
  - context
  - retrieval
  - verification
  - offline
license: MIT
homepage: https://github.com/ilPez00/physis-core
