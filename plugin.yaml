name: physis
version: 1.7.1
description: >
  Evidence-backed execution memory: per-repo graph context, a verify hook, and
  verified tool recipes that replay with zero provider calls and refuse when
  captured inputs changed. Sessions that pass their check become approvable
  workflow candidates. Two bundled engines, no API key. Python entry points
  require a Python interpreter and standard library; verify_cmd and approved
  commands run with the configured user's filesystem and network access.
  physis_ingest can read sensitive sources — shell history (terminal), other
  coding agents' transcripts under ~/.claude/projects (agent), every process's
  /proc/<pid>/cmdline (process) and the browser history database (browser) —
  only when the operator lists them in
  plugins.entries.physis.settings.ingest_sources; they are disabled by default
  (fs and git only), and physis_observed never returns a disabled bucket.
author: Giovanni Pezzulli
requires_hermes: ">=0.23.0"
provides_tools:
  - physis_engine_status
  - physis_trace
  - physis_observe
  - physis_snapshot
  - physis_context
  - physis_query
  - physis_why
  - physis_diff
  - physis_classify
  - physis_chain
  - physis_grid
  - physis_ingest
  - physis_observed
  - replant_stats
  - replant_demo
  - replant_show
  - physis_candidates
provides_hooks:
  - post_tool_call
  - pre_verify
  - pre_llm_call
config_schema:
  engine_bin:
    type: str
    default: ""
    description: "Optional override: path to physis-core, replant or a compatible engine (comma-separated allowed)"
  model_dir:
    type: str
    default: ""
    description: "Optional ONNX embedding model directory; empty = bundled BGE-small"
  semantic:
    type: bool
    default: true
    description: "Use the bundled/overridden semantic embedder (BGE-small); false = deterministic hashing (reproducible, not semantic)"
  auto_expand:
    type: bool
    default: true
    description: "When a classification is uncertain, add a learned ontology entry"
  auto_observe:
    type: bool
    default: false
    description: "After file writes, incrementally re-index the edited folder (bounded, best-effort)"
  verify_cmd:
    type: str
    default: ""
    description: "Command run after code edits; a non-zero exit keeps the turn going with the real failure output"
  auto_learn:
    type: bool
    default: false
    description: "After verify_cmd passes, save the session's shell steps as a workflow candidate (never replayed until approved)"
  ingest_sources:
    type: list
    default: ["fs", "git"]
    description: "Observation sources physis_ingest may read. fs and git are enabled by default; terminal (shell history), agent (~/.claude/projects transcripts), process (/proc/<pid>/cmdline) and browser (history database) are sensitive and refused unless listed here. physis_observed filters out buckets not listed."
  replant_tools:
    type: str
    default: ""
    description: "Operator-owned tools registry for replay/record; empty = the plugin-generated learned registry (~/.physis/replant/learned/tools.json) after /physis approve. Never taken from a repository path or model argument."
  budget:
    type: int
    default: 800
    description: "Default token budget for physis_context packets (100-4000)"
  timeout:
    type: int
    default: 20
    description: "Per-engine subprocess timeout in seconds"
tags:
  - code
  - context
  - retrieval
  - verification
  - offline
license: MIT
homepage: https://github.com/ilPez00/hermes-physis
